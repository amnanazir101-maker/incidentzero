name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q tests
      - run: python scripts/check_banned_imports.py
      - run: python scripts/check_protected_integrity.py
      - run: python scripts/run_offline.py --student-id 24I-8070 --all
