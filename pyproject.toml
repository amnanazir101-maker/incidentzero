[project]
name = "incidentzero"
version = "0.1.0"
description = "A framework-free, bounded autonomous SRE agent: an LLM proposes, a Python runtime validates, approves, verifies and stops."
requires-python = ">=3.11"

[tool.pytest.ini_options]
markers = [
    "infrastructure: starter infrastructure tests that should pass before student work",
    "student: behavioral requirements students must satisfy",
]
pythonpath = ["."]
